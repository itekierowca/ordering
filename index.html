<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kolejność przejazdu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: narrow app bar, then one "device frame" in the chosen aspect (16:9 / 9:16 / 1:1) holding scene + answer panel */
:root{
  --bg:#E9ECEF; --surface:#FFFFFF; --ink:#14181D; --muted:#59626D; --line:#D2D8DF;
  --scene:#2B3036; --sign:#F5C400; --sign-ink:#111111; --ok:#1C7F46; --bad:#C3362B; --focus:#1F5FD1;
  --ok-soft:#E3F3EA; --bad-soft:#FBE7E5; --chip:#F2F4F6;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1114; --surface:#181C21; --ink:#E8EBEE; --muted:#9AA3AD; --line:#2B323A;
  --scene:#0A0C0E; --ok:#43B874; --bad:#F06A5E; --focus:#6E9CFF; --ok-soft:#173022; --bad-soft:#3A1B18; --chip:#22282F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1114; --surface:#181C21; --ink:#E8EBEE; --muted:#9AA3AD; --line:#2B323A;
  --scene:#0A0C0E; --ok:#43B874; --bad:#F06A5E; --focus:#6E9CFF; --ok-soft:#173022; --bad-soft:#3A1B18; --chip:#22282F; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.app{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:12px;min-height:100%}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.01em;margin:0;text-wrap:balance}
.brand span{color:var(--muted);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.dots{display:flex;gap:6px;align-items:center}
.dot{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-display);font-weight:600;font-size:14px;cursor:pointer;display:grid;place-items:center;color:var(--muted);padding:0}
.dot[disabled]{cursor:default;opacity:.55}
.dot.cur{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 -3px 0 var(--sign)}
.dot.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.dot.bad{background:var(--bad);border-color:var(--bad);color:#fff}

.stage{flex:1;min-height:0;display:grid;align-items:start;justify-items:center}
.frame{container-type:size;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;position:relative;
  box-shadow:0 1px 2px rgba(0,0,0,.06),0 12px 40px -18px rgba(0,0,0,.35);font-size:var(--fs)}
.frame.landscape{--fs:1.2cqw;--tok:3.1cqw;grid-template-columns:1fr 33cqw}
.frame.portrait{--fs:3.7cqw;--tok:8.6cqw;grid-template-rows:auto auto 1fr}

.scene[data-err]::before{content:attr(data-err);position:absolute;z-index:5;color:#fff;font-size:.95em;padding:1em;text-align:center}
.scene{position:relative;background:var(--scene);display:grid;place-items:center;min-height:0;min-width:0}
.viewport{position:relative;width:100%;overflow:hidden;max-width:100%}
.inner{position:absolute;top:0;height:100%}
.inner img{display:block;width:100%;height:100%;object-fit:fill;user-select:none;-webkit-user-drag:none;pointer-events:none}

.zone{position:absolute;border:2px dashed rgba(255,255,255,.85);border-radius:6px;background:rgba(255,255,255,.06);cursor:pointer;padding:0;display:grid;place-items:center;
  box-shadow:0 0 0 1px rgba(0,0,0,.35);transition:background .15s,border-color .15s}
.zone:hover,.zone.over{background:rgba(245,196,0,.22);border-color:var(--sign);border-style:solid}
.zone.armed{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{background:rgba(245,196,0,.25)}}
.zone.ok{border:3px solid #3FD27E;background:rgba(63,210,126,.12)}
.zone.bad{border:3px solid #FF6B5E;background:rgba(255,107,94,.14)}
.zone .fix{position:absolute;right:-.2em;bottom:-.2em;transform:translate(30%,30%);background:#3FD27E;color:#08200F;font-family:var(--f-display);font-weight:700;
  font-size:calc(var(--tok)*.42);padding:.05em .35em;border-radius:4px;white-space:nowrap;line-height:1.2}

.tok{width:var(--tok);height:var(--tok);border-radius:18%;background:var(--sign);color:var(--sign-ink);border:calc(var(--tok)*.05) solid #111;
  box-shadow:0 0 0 calc(var(--tok)*.06) #fff,0 2px 6px rgba(0,0,0,.45);font-family:var(--f-display);font-weight:700;font-size:calc(var(--tok)*.62);
  display:grid;place-items:center;line-height:1;cursor:grab;touch-action:none;user-select:none;padding:0;position:relative}
.tok.sel{outline:3px solid var(--focus);outline-offset:calc(var(--tok)*.1)}
.tok.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) scale(1.12);cursor:grabbing}
.tok.lifted{opacity:.25}
.locked .tok{cursor:default}

.panel{display:flex;flex-direction:column;gap:.9em;padding:1.3em 1.4em;min-height:0;min-width:0;overflow:hidden}
.frame.portrait .panel{padding:.9em 1.1em 1.1em;gap:.7em}
.qhead{display:flex;flex-direction:column;gap:.25em}
.frame.portrait .qhead{padding:.9em 1.1em .7em}
.kicker{font-family:var(--f-display);font-weight:600;font-size:.9em;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.qtext{font-family:var(--f-display);font-weight:600;font-size:1.45em;line-height:1.15;margin:0;text-wrap:balance}
.hint{color:var(--muted);font-size:.92em;margin:0}

.tray{display:flex;flex-wrap:wrap;gap:calc(var(--tok)*.45);align-items:center;min-height:calc(var(--tok)*1.5);padding:calc(var(--tok)*.25) calc(var(--tok)*.3);
  border:1.5px dashed var(--line);border-radius:10px;background:var(--chip)}
.tray.empty::after{content:"Wszystkie numery są na scenie. Możesz je przeciągać między pojazdami.";color:var(--muted);font-size:.88em}
.actions{display:flex;gap:.6em;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.55em 1.1em;cursor:pointer;font-weight:600;font-size:1em}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed}

.feedback{overflow:auto;min-height:0;display:flex;flex-direction:column;gap:.8em;padding-right:.2em}
.verdict{display:flex;align-items:center;gap:.6em;font-family:var(--f-display);font-weight:700;font-size:1.35em;padding:.35em .6em;border-radius:8px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.order{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.35em}
.order li{display:grid;grid-template-columns:auto 1fr;gap:.6em;align-items:start}
.order .n{width:1.6em;height:1.6em;border-radius:4px;background:var(--sign);color:#111;border:1.5px solid #111;font-family:var(--f-display);font-weight:700;display:grid;place-items:center;font-size:.95em}
.why{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:.35em}
.law{border-left:3px solid var(--sign);background:var(--chip);border-radius:0 8px 8px 0;padding:.55em .8em;display:flex;flex-direction:column;gap:.2em}
.law b{font-family:var(--f-mono);font-weight:500;font-size:.85em;letter-spacing:.02em}
.law q{font-size:.92em;color:var(--muted);quotes:"„" "”"}
h3.sub{font-family:var(--f-display);font-weight:600;font-size:1em;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:.2em 0 0}

.summary{grid-column:1/-1;grid-row:1/-1;display:flex;flex-direction:column;gap:1em;padding:2em;overflow:auto}
.summary .score{font-family:var(--f-display);font-weight:700;font-size:4.2em;line-height:1}
.summary ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:.4em}
.summary li button{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.5em .8em;cursor:pointer;display:flex;gap:.7em;align-items:center}
.mark{font-family:var(--f-display);font-weight:700;width:1.5em;text-align:center}
.mark.ok{color:var(--ok)} .mark.bad{color:var(--bad)}
.foot{color:var(--muted);font-size:12px;text-align:center}
/* iOS: no text-selection callout while dragging numbers */
.app{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.feedback{-webkit-user-select:text;user-select:text}
/* portrait grows with its content, so the scene can use the full width */
.frame.portrait{container-type:inline-size;height:auto}
.frame.portrait .panel,.frame.portrait .feedback{overflow:visible}
@media (max-width:700px){
  body{padding-block:8px}
  .app{gap:10px}
  .bar{gap:8px}
  .brand h1{font-size:22px}
  .brand span{font-size:11px}
  .brand span{display:none}
  .dots{gap:4px}
  .dot{width:25px;height:25px}
  .stage{display:block;margin-left:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));margin-right:calc(-1 * max(16px, env(safe-area-inset-right, 0px)))}
  .frame{border-radius:0;border-left:0;border-right:0;box-shadow:none}
  .frame.portrait{--fs:3.9cqw;--tok:9cqw}
  .foot{padding-bottom:56px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">

const FORMATS={landscape:16/9,portrait:9/16};
const MOBILE=matchMedia("(max-width:700px), (pointer:coarse) and (orientation:portrait)");
const S={fmt:null,i:0,place:{},sel:null,res:Array(Q.length).fill(null),view:"q"};
const frame=document.getElementById("frame"),stage=document.getElementById("stage"),dotsEl=document.getElementById("dots");
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// layout follows the device: phone / portrait screen -> vertical, desktop -> horizontal
function autoFmt(){const f=MOBILE.matches?"portrait":"landscape";
  if(f!==S.fmt){S.fmt=f;frame.className="frame "+f;size();render()}else size();}
function size(){
  const r=FORMATS[S.fmt],aw=stage.clientWidth,mobile=innerWidth<=700;
  const ah=Math.max(innerHeight-stage.getBoundingClientRect().top-56,420);
  let w,h;
  if(mobile){w=aw;h=w/r}
  else{w=Math.min(aw,ah*r);h=w/r;if(h>ah){h=ah;w=h*r}}
  frame.style.width=Math.floor(w)+"px";
  frame.style.height=S.fmt==="portrait"?"":Math.floor(h)+"px";
}
addEventListener("resize",autoFmt);

function crop(q){ // fraction of image width visible, and left offset
  if(S.fmt!=="portrait")return{cw:1,left:0,ar:16/9};
  // tightest crop that keeps every vehicle (and q.keep, e.g. a long arrow), between 1:1 and 16:9
  const xs=q.zones.flatMap(z=>[z.r[0],z.r[0]+z.r[2]]).concat(q.keep||[]);
  const x0=Math.min(...xs),x1=Math.max(...xs);
  const cw=Math.min(1,Math.max(.5625,x1-x0+.1));
  let left=((x0+x1)/2+.5)/2-cw/2;          // lean toward the middle of the junction
  left=Math.min(left,x0-.03);left=Math.max(left,x1+.03-cw);
  left=Math.min(Math.max(left,0),1-cw);
  return{cw,left,ar:cw*16/9};
}

function dots(){
  dotsEl.innerHTML=Q.map((q,k)=>{const r=S.res[k],cls=[k===S.i&&S.view==="q"?"cur":"",r?(r.ok?"ok":"bad"):""].join(" ");
    const can=r||k===firstOpen();return `<button class="dot ${cls}" data-k="${k}" ${can?"":"disabled"} aria-label="Pytanie ${k+1}${r?(r.ok?", dobrze":", źle"):""}">${k+1}</button>`}).join("");
}
function firstOpen(){const k=S.res.findIndex(r=>!r);return k<0?Q.length:k}

function render(){
  dots();
  if(S.view==="sum")return renderSum();
  const q=Q[S.i],res=S.res[S.i],locked=!!res,place=locked?res.place:S.place;
  const {cw,left,ar}=crop(q);
  const placed=new Set(Object.values(place));
  const nums=q.zones.map((_,k)=>k+1);
  const zonesHTML=q.zones.map(z=>{
    const t=place[z.id];let cls="zone";let fix="";
    if(locked){const want=q.order.indexOf(z.id)+1;cls+=t===want?" ok":" bad";if(t!==want)fix=`<span class="fix">${want}</span>`}
    return `<button class="${cls}${S.sel&&!locked?" armed":""}" data-z="${z.id}" aria-label="${esc(z.name)}${t?", numer "+t:""}" style="left:${z.r[0]*100}%;top:${z.r[1]*100}%;width:${z.r[2]*100}%;height:${z.r[3]*100}%">${t?tok(t,true):""}${fix}</button>`}).join("");
  const scene=`<div class="scene"><div class="viewport" style="aspect-ratio:${ar}"><div class="inner" style="width:${100/cw}%;left:${-left/cw*100}%">
     <img src="${q.img}" alt="Scena: ${esc(q.topic)}" draggable="false" onerror="this.closest('.scene').setAttribute('data-err','Nie udało się wczytać grafiki. Sprawdź połączenie z internetem.')">${zonesHTML}</div></div></div>`;
  const head=`<div class="qhead"><div class="kicker">Pytanie ${S.i+1} z ${Q.length} · ${esc(q.topic)}</div><p class="qtext">${esc(q.q)}</p>
     ${locked?"":`<p class="hint">Przeciągnij numery na pojazdy. 1 = jedzie pierwszy.</p>`}</div>`;
  let body;
  if(!locked){
    const free=nums.filter(n=>!placed.has(n));
    body=`<div class="tray${free.length?"":" empty"}" id="tray" aria-label="Numery do rozmieszczenia">${free.map(n=>tok(n)).join("")}</div>
      <div class="actions"><button class="btn primary" id="check" ${placed.size===nums.length?"":"disabled"}>Sprawdź</button>
      <button class="btn" id="clear" ${placed.size?"":"disabled"}>Wyczyść</button></div>`;
  }else{
    const allDone=S.res.every(Boolean);
    body=`<div class="feedback">
      <div class="verdict ${res.ok?"ok":"bad"}">${res.ok?"✓ Dobrze":"✗ Błędna kolejność"}</div>
      <h3 class="sub">Prawidłowa kolejność</h3>
      <ol class="order">${q.order.map((id,k)=>`<li><span class="n">${k+1}</span><span>${esc(q.zones.find(z=>z.id===id).name)}</span></li>`).join("")}</ol>
      <h3 class="sub">Uzasadnienie</h3>
      <ul class="why">${q.why.map(w=>`<li>${esc(w)}</li>`).join("")}</ul>
      <h3 class="sub">Podstawa prawna</h3>
      ${q.law.map(k=>`<div class="law"><b>${esc(L[k].ref)}</b><q>${esc(L[k].text)}</q></div>`).join("")}
      </div>
      <div class="actions">${allDone?`<button class="btn primary" id="sum">Zobacz wynik</button>`:`<button class="btn primary" id="next">Następne pytanie</button>`}</div>`;
  }
  frame.classList.toggle("locked",locked);
  frame.innerHTML = S.fmt==="portrait" ? head+scene+`<div class="panel">${body}</div>`
                  : scene+`<div class="panel">${head}${body}</div>`;
  if(S.sel){const el=frame.querySelector(`.tok[data-n="${S.sel}"]`);el&&el.classList.add("sel")}
}
function tok(n,inZone){return `<span class="tok" role="button" tabindex="0" data-n="${n}" aria-label="Numer ${n}${inZone?" (umieszczony)":""}">${n}</span>`}

function renderSum(){
  frame.classList.remove("locked");
  const ok=S.res.filter(r=>r&&r.ok).length;
  frame.innerHTML=`<div class="summary"><div class="kicker">Wynik</div><div class="score">${ok} / ${Q.length}</div>
   <p class="hint">${ok===Q.length?"Wszystkie sytuacje rozwiązane poprawnie.":"Kliknij pytanie, żeby zobaczyć uzasadnienie i podstawę prawną."}</p>
   <ul>${Q.map((q,k)=>`<li><button data-k="${k}"><span class="mark ${S.res[k].ok?"ok":"bad"}">${S.res[k].ok?"✓":"✗"}</span><span>${k+1}. ${esc(q.topic)}</span></button></li>`).join("")}</ul>
   <div class="actions"><button class="btn primary" id="again">Rozwiąż ponownie</button></div></div>`;
}

function zoneOf(n){return Object.keys(S.place).find(k=>S.place[k]===n)}
function move(n,target){
  const src=zoneOf(n);
  if(target){const ex=S.place[target];S.place[target]=n;if(src&&src!==target){ex?S.place[src]=ex:delete S.place[src]}}
  else if(src)delete S.place[src];
  S.sel=null;render();
}
function check(){
  const q=Q[S.i],ok=q.order.every((id,k)=>S.place[id]===k+1);
  S.res[S.i]={place:{...S.place},ok};S.place={};S.sel=null;render();
}
function go(k){S.view="q";S.i=k;S.place={};S.sel=null;render()}

// clicks
frame.addEventListener("click",e=>{
  if(suppressClick){suppressClick=false;return}
  const b=e.target.closest("button,.tok");if(!b)return;
  if(b.id==="check")return check();
  if(b.id==="clear"){S.place={};S.sel=null;return render()}
  if(b.id==="next"){const k=firstOpen();if(k>=Q.length){S.view="sum";return render()}return go(k)}
  if(b.id==="sum"){S.view="sum";return render()}
  if(b.id==="again"){S.res=Array(Q.length).fill(null);return go(0)}
  if(b.dataset.k)return go(+b.dataset.k);
  if(S.res[S.i])return;
  if(b.classList.contains("tok")){const n=+b.dataset.n;
    if(S.sel&&S.sel!==n&&b.closest(".zone")){return move(S.sel,b.closest(".zone").dataset.z)}
    S.sel=S.sel===n?null:n;return render()}
  if(b.classList.contains("zone")&&S.sel)return move(S.sel,b.dataset.z);
});
frame.addEventListener("click",e=>{if(e.target.closest("#tray")&&!e.target.closest(".tok")&&S.sel&&!S.res[S.i])move(S.sel,null)});
frame.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("tok")){e.preventDefault();e.target.click()}
  if(e.key==="Escape"&&S.sel){S.sel=null;render()}});
dotsEl.addEventListener("click",e=>{const b=e.target.closest(".dot");if(b&&!b.disabled)go(+b.dataset.k)});

// drag
let drag=null,suppressClick=false;
frame.addEventListener("pointerdown",e=>{
  const t=e.target.closest(".tok");if(!t||S.res[S.i]||S.view!=="q")return;
  drag={n:+t.dataset.n,el:t,x:e.clientX,y:e.clientY,on:false,id:e.pointerId};
});
addEventListener("pointermove",e=>{
  if(!drag||e.pointerId!==drag.id)return;
  if(!drag.on){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<5)return;
    drag.on=true;const g=drag.el.cloneNode(true);g.classList.add("ghost");g.classList.remove("sel");
    const cs=getComputedStyle(drag.el);g.style.width=cs.width;g.style.height=cs.height;g.style.fontSize=cs.fontSize;
    document.body.appendChild(g);drag.g=g;drag.el.classList.add("lifted")}
  e.preventDefault();
  drag.g.style.left=e.clientX+"px";drag.g.style.top=e.clientY+"px";
  frame.querySelectorAll(".zone.over").forEach(z=>z.classList.remove("over"));
  const z=hit(e);z&&z.classList.add("over");
},{passive:false});
function hit(e){const el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.closest(".zone")}
function end(e){
  if(!drag||e.pointerId!==drag.id)return;
  if(drag.on){const z=hit(e);drag.g.remove();suppressClick=true;setTimeout(()=>suppressClick=false,0);
    const inTray=document.elementFromPoint(e.clientX,e.clientY)?.closest("#tray");
    if(z)move(drag.n,z.dataset.z);else if(inTray||zoneOf(drag.n))move(drag.n,null);else render()}
  drag=null;
}
addEventListener("pointerup",end);addEventListener("pointercancel",e=>{if(drag&&drag.g)drag.g.remove();drag=null;render()});

// init
autoFmt();
requestAnimationFrame(size);
</script>

</html>
